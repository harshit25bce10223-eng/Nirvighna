<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nirvighna — Temple Pilgrimage Crowd Management</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Instant zero-flash ivory background and animated divine pre-mount loader -->
    <style>
      html, body, #root {
        background-color: #FAF7F2 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 20px rgba(245,158,11,0.35); }
        50% { transform: scale(1.04); opacity: 0.95; box-shadow: 0 0 35px rgba(245,158,11,0.6); }
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .premount-logo {
        animation: splashPulse 2.2s infinite ease-in-out;
      }
      .premount-text {
        animation: splashFadeIn 0.8s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-[#FAF7F2] text-gray-900 antialiased selection:bg-gold selection:text-indigo-dark min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #FFFDF9 0%, #FAF7F2 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; gap: 16px; user-select: none;">
        <div class="premount-logo" style="width: 72px; height: 72px; border-radius: 9999px; background-color: #ffffff; border: 2.5px solid #F59E0B; padding: 6px; display: flex; align-items: center; justify-content: center;">
          <img src="/official_logo.png" alt="Nirvighna" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <div class="premount-text" style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <div style="font-size: 22px; font-weight: 900; color: #7C1D24; letter-spacing: 3px; font-family: 'Poppins', sans-serif;">
            NIRVIGHNA
          </div>
          <div style="font-size: 11px; font-weight: 800; color: #92400E; letter-spacing: 2px; text-transform: uppercase;">
            Sacred Pilgrim Portal
          </div>
        </div>
      </div>
    </div>
    <script>
      (function() {
        try {
          var h = window.location.hash || '';
          var p = window.location.pathname;
          // Fix legacy / mixed URL formats so HashRouter opens the right portal.
          // Rewrite the FULL URL (pathname -> '/') to avoid infinite redirect loops:
          //   /command-centre/login#/login  ->  /#/command-centre/login
          //   /command-centre/login         ->  /#/command-centre/login
          //   /home                         ->  /#/home
          if (p !== '/' && (h.startsWith('#/') || !h)) {
            window.location.replace('/#' + p);
            return;
          }
          if (h.indexOf('access_token=') !== -1) {
            var params = new URLSearchParams(h.replace(/^#\/?/, ''));
            var tok = params.get('access_token');
            var ref = params.get('refresh_token');
            if (tok) {
              sessionStorage.setItem('sb_incoming_access_token', tok);
              sessionStorage.setItem('sb_incoming_refresh_token', ref || '');
            }
          }
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
