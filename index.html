<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nirvighna — Temple Pilgrimage Crowd Management</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Instant zero-flash ivory background -->
    <style>
      html, body, #root {
        background-color: #FAF7F2 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
      }
    </style>
  </head>
  <body class="bg-[#FAF7F2] text-gray-900 antialiased selection:bg-gold selection:text-indigo-dark min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FAF7F2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; gap: 14px; user-select: none;">
        <div style="width: 64px; height: 64px; border-radius: 9999px; background-color: #ffffff; border: 2px solid #F59E0B; padding: 4px; box-shadow: 0 4px 18px rgba(245,158,11,0.25); display: flex; align-items: center; justify-content: center;">
          <img src="/official_logo.png" alt="Nirvighna" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <div style="font-size: 19px; font-weight: 900; color: #7C1D24; letter-spacing: 2.5px;">
          NIRVIGHNA
        </div>
        <div style="font-size: 10.5px; font-weight: 800; color: #92400E; letter-spacing: 2px; text-transform: uppercase;">
          Sacred Pilgrim Portal
        </div>
      </div>
    </div>
    <script>
      (function() {
        try {
          var h = window.location.hash || '';
          if (h.indexOf('access_token=') !== -1) {
            var params = new URLSearchParams(h.replace(/^#\/?/, ''));
            var tok = params.get('access_token');
            var ref = params.get('refresh_token');
            if (tok) {
              sessionStorage.setItem('sb_incoming_access_token', tok);
              sessionStorage.setItem('sb_incoming_refresh_token', ref || '');
            }
          }
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
