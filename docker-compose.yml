version: '3.8'

services:
  # 1. ML Crowd Prediction Microservice (Port 8000)
  prediction-service:
    build:
      context: ./backend/ml_engine
      dockerfile: Dockerfile
    container_name: nirvighna_ml_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://nirvighna_user:nirvighna_pass@postgres-db:5432/nirvighna_db
    depends_on:
      postgres-db:
        condition: service_healthy

  # 2. Drishti AI Vision & Audio Microservice (Port 8001)
  drishti-ai:
    build:
      context: .
      dockerfile: backend/Dockerfile.drishti
    container_name: nirvighna_drishti_ai
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - CAMERA_INDEX=0
    volumes:
      - ./backend/models:/app/backend/models

  # 3. PostgreSQL Database
  postgres-db:
    image: postgres:15-alpine
    container_name: nirvighna_postgres
    restart: always
    environment:
      POSTGRES_USER: nirvighna_user
      POSTGRES_PASSWORD: nirvighna_pass
      POSTGRES_DB: nirvighna_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirvighna_user -d nirvighna_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
