name: Build and Release Nirvighna Volunteer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Volunteer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install

      - name: Build Volunteer Web Assets
        run: npm run build:volunteer

      - name: Copy Volunteer Web Assets into Android Project
        run: |
          DEST="android/app/src/main/assets/public"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r dist-volunteer/. "$DEST/"
          echo "✓ Volunteer assets copied to $DEST"
          ls "$DEST"

      - name: Configure Android SDK & License Agreement
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n89337d1c0b38038b5183877d13d4549dd367a660\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build Volunteer Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          sh ./gradlew assembleDebug --no-daemon

      - name: Rename & Move APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nirvighna-Volunteer.apk
          echo "✓ APK ready: Nirvighna-Volunteer.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nirvighna-Volunteer-APK
          path: Nirvighna-Volunteer.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest-volunteer
          name: "Nirvighna Volunteer Operations App"
          body: |
            📱 **Nirvighna Volunteer Field Ops APK**
            
            Install on any Android device for:
            - QR Gate Scanning
            - Medical Triage Alerts  
            - Lost & Found Management
            - Prasad & Footwear Counter
          draft: false
          prerelease: false
          files: Nirvighna-Volunteer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
