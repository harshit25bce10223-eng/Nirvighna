name: Build and Release Nirvighna Pilgrim APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nirvighna-Pilgrim.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nirvighna-Pilgrim-APK
          path: Nirvighna-Pilgrim.apk

      - name: Create Direct APK GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Nirvighna Pilgrim App Official Release"
          body: "Official standalone Android APK for Nirvighna Pilgrim Portal (Darshan Passes, Queue Tracking & Audio Guidance)."
          draft: false
          prerelease: false
          files: Nirvighna-Pilgrim.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
