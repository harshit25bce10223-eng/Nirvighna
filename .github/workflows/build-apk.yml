name: Build and Release Nirvighna Pilgrim APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Native Android
        run: npx cap sync android

      - name: Configure Android SDK & License Agreement
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n89337d1c0b38038b5183877d13d4549dd367a660\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          sh ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nirvighna-Pilgrim.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nirvighna-Pilgrim-APK
          path: Nirvighna-Pilgrim.apk

      - name: Create Direct APK GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Nirvighna Pilgrim App Official Standalone Release"
          body: "Official standalone Android APK for Nirvighna Pilgrim Portal (Darshan Passes, Queue Tracking & Audio Guidance)."
          draft: false
          prerelease: false
          files: Nirvighna-Pilgrim.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
