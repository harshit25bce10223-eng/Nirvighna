name: Build and Release Nirvighna Pilgrim APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Native Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nirvighna-Pilgrim.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nirvighna-Pilgrim-APK
          path: Nirvighna-Pilgrim.apk

      - name: Create Direct APK GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Nirvighna Pilgrim App Official Standalone Release"
          body: "Official standalone Android APK for Nirvighna Pilgrim Portal (Darshan Passes, Queue Tracking & Audio Guidance)."
          draft: false
          prerelease: false
          files: Nirvighna-Pilgrim.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
